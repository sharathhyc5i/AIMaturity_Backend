name: Deploy backend

# Every push to main packages the API and deploys it to Azure App Service (ai-maturity-backend).
# Azure builds the Python packages from requirements.txt on the server (SCM_DO_BUILD_DURING_DEPLOYMENT=true).
# Uses the app's publish profile, stored as the repo secret AZURE_WEBAPP_PUBLISH_PROFILE.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the API
        run: zip -rq "$RUNNER_TEMP/backend.zip" . -x ".git/*" ".github/*"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ai-maturity-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/backend.zip
