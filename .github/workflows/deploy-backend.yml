name: Deploy backend

# Every push to main packages the API and deploys it to Azure App Service (ai-maturity-backend).
# Azure builds the Python packages from requirements.txt on the server (SCM_DO_BUILD_DURING_DEPLOYMENT=true).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Package the API
        run: zip -rq "$RUNNER_TEMP/backend.zip" . -x ".git/*" ".github/*"

      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --resource-group AI-Maturity \
            --name ai-maturity-backend \
            --src-path "$RUNNER_TEMP/backend.zip" \
            --type zip \
            --timeout 1200000
